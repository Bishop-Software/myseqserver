; Byte-pattern signatures used by the "Offset Finder" scanner
; (EQGameScanner::ScanExecutable / ScanSecondary) to locate the real
; in-memory offsets recorded in myseqserver.ini. These patterns change
; between EQ client patches/expansions -- edit them here, not the C++
; scanning logic, when a client update breaks scanning. See CLAUDE.md's
; "Working with byte-pattern offsets" section for the Pattern/Mask format.

; Every pattern below is a run of whole instructions around the field being
; captured. Bytes that change on every client rebuild even when the
; surrounding code doesn't -- RIP-relative disp32 fields of neighbouring
; instructions and rel8/rel32 jump/call targets -- are wildcarded ('?') so
; a pattern survives a recompile, and only the opcode/ModRM bytes plus
; struct displacements stay fixed ('x'). Each pattern was verified to match
; exactly once in the 2026-09-17 live, 2026-10-19 live and 2026-10-17 beta
; eqgame.exe builds.

; Note: ZoneAddr/SpawnHeaderAddr/CharInfo/ItemsAddr/TargetAddr/WorldAddr are
; resolved via EQGameScanner::findEQAbsolutePointer, not findEQPointerOffset.
; Unlike the SpawnInfo* struct-offset patterns below (which capture a plain
; immediate displacement, already the value we want), these six patterns
; capture the disp32 field of a RIP-relative x64 instruction
; (`lea`/`mov [rip+disp32]`); the resolver computes the referenced absolute
; address as imageBase + instructionEndRVA + disp32. Start=0x400 is the file
; offset of the .text section, and the scanner searches to the end of
; whichever PE section contains Start (EQGameScanner::scanBlockSize) rather
; than a narrow window, since these instructions can move between client
; patches and .text grows with each expansion.

; mov [rip+ZoneAddr], rbx; mov rax, [rcx]; call [rax+8]
[ZoneAddr]
Start=0x400
Pattern=\x48\x89\x1D\x3D\xB6\xD0\x00\x48\x8B\x01\xFF\x50\x08
Mask=xxxttttxxxxxx

; mov [rip+SpawnHeaderAddr], rax; mov ecx, 0x60
[SpawnHeaderAddr]
Start=0x400
Pattern=\x48\x89\x05\x00\xE3\xCB\x00\xB9\x60\x00\x00\x00
Mask=xxxttttxxxxx

; mov [rax+0x30], rsi; mov [rip+CharInfo], rsi
[CharInfo]
Start=0x400
Pattern=\x48\x89\x70\x30\x48\x89\x35\xDC\xD0\xD1\x00
Mask=xxxxxxxtttt

; mov rax, [rbx+8]; mov [rip+ItemsAddr], rax; mov rcx, [rbx]
[ItemsAddr]
Start=0x400
Pattern=\x48\x8B\x43\x08\x48\x89\x05\x35\xA8\x66\x00\x48\x8B\x0B
Mask=xxxxxxxttttxxx

; mov ebx, esi; mov [rip+TargetAddr], rdx
[TargetAddr]
Start=0x400
Pattern=\x8B\xDE\x48\x89\x15\xBE\x40\xCF\x00
Mask=xxxxxtttt

; mov [rip+WorldAddr], rax; mov rcx, [rip+?]; call ?; test al, al
[WorldAddr]
Start=0x400
Pattern=\x48\x89\x05\xE6\xF6\xC3\x00\x48\x8B\x0D\x77\x1C\xC4\x00\xE8\x22\x21\xF3\xFF\x84\xC0
Mask=xxxttttxxx????x????xx

; The SpawnInfo* struct-offset patterns below are resolved via the plain
; findEQPointerOffset (byte-pattern match + capture the 't'-marked field
; as-is - no RIP-relative math involved, unlike the six primary offsets
; above). Each one captures the displacement of a real spawn-struct field
; access, preferring an access found close to where the game loads the
; CharInfo pointer, for confidence that it's genuinely a spawn-struct
; field. Start=0x400/full-.text scanning, as above, for the same
; patch-resilience reason.

; mov ebx, [rcx+Next]; mov edx, [rax+0x168]
[SpawnInfoNextOffset]
Start=0x400
Pattern=\x8B\x59\x08\x8B\x90\x68\x01\x00\x00
Mask=xxtxxxxxx

; Spawn destructor unlinking itself from the spawn list (followed by a call
; through SpawnHeaderAddr): mov rcx, [rcx+8]; mov rax, [rbx+Prev]; ...
[SpawnInfoPrevOffset]
