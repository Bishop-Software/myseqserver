[Server]
StartMinimized=0

; Note: ZoneAddr/SpawnHeaderAddr/CharInfo/ItemsAddr/TargetAddr/WorldAddr are
; resolved via EQGameScanner::findEQAbsolutePointer, not findEQPointerOffset.
; Unlike the SpawnInfo* struct-offset patterns below (which capture a plain
; immediate displacement, already the value we want), these six patterns
; capture the disp32 field of a RIP-relative x64 instruction
; (`lea`/`mov [rip+disp32]`); the resolver computes the referenced absolute
; address as imageBase + instructionEndRVA + disp32. Start=0x400 is the file
; offset of the .text section, and the scanner searches the whole section
; (see the 0x900000 blockSize passed at the call sites in EQGameScanner.cpp)
; rather than a narrow window, since these instructions can move between
; client patches. (32-bit EQ clients embedded absolute addresses as literal
; 4-byte immediate, which is what the old patterns here were written
; against; that scheme doesn't apply to 64-bit code.)

[ZoneAddr]
Start=0x400
Pattern=\x01\x48\x89\x1D\x3D\xB6\xD0\x00\x48\x8B\x01\xFF
Mask=xxxxttttxxxx

[SpawnHeaderAddr]
Start=0x400
Pattern=\xC4\x48\x89\x05\x00\xE3\xCB\x00\xB9\x60\x00\x00
Mask=xxxxttttxxxx

[CharInfo]
Start=0x400
Pattern=\x30\x48\x89\x35\xDC\xD0\xD1\x00\x48\x89\x35\x7D
Mask=xxxxttttxxxx

[ItemsAddr]
Start=0x400
Pattern=\x08\x48\x89\x05\x35\xA8\x66\x00\x48\x8B\x0B\x48
Mask=xxxxttttxxxx

[TargetAddr]
Start=0x400
Pattern=\xDE\x48\x89\x15\xBE\x40\xCF\x00\x48\x39\x35\xE7
Mask=xxxxttttxxxx

[WorldAddr]
Start=0x400
Pattern=\xC4\x48\x89\x05\xE6\xF6\xC3\x00\x48\x8B\x0D\x77
Mask=xxxxttttxxxx

; The SpawnInfo* struct-offset patterns below are resolved via the plain
; findEQPointerOffset (byte-pattern match + capture the 't'-marked field
; as-is - no RIP-relative math involved, unlike the six primary offsets
; above). They were also unmodified 32-bit-era patterns (opcode A1, `mov
; eax, moffs32` - a legacy absolute-address load form) and equally
; non-functional against a 64-bit client; replaced the same way, by
; locating the real struct-field-access instruction for each offset in a
; current eqgame.exe (preferring an access found close to where the game
; loads the CharInfo pointer, for confidence that it's genuinely a spawn-
; struct field access) and capturing a short, globally-unique byte window
; around it. Start=0x400/full-.text scanning, as above, for the same
; patch-resilience reason.

[SpawnInfoNextOffset]
Start=0x400
Pattern=\xE8\xC9\x00\x8B\x59\x08\x8B\x90\x68\x01
Mask=xxxxxtxxxx

[SpawnInfoPrevOffset]
Start=0x400
Pattern=\x55\xDA\x00\xE8\x67\x10\x12\x00\x90\x48
Mask=xxxxxtxxxx

[SpawnInfoLastnameOffset]
Start=0x400
Pattern=\x97\x00\x49\x8D\x41\x48\x49\x81\xC1\xB4
Mask=xxxxxtxxxx

[SpawnInfoXOffset]
Start=0x400
Pattern=\xDC\xC1\x00\x89\x41\x74\x8B\x47\x04\x89
Mask=xxxxxtxxxx

[SpawnInfoYOffset]
Start=0x400
Pattern=\x48\x8B\x05\xF8\x0A\xC3\x00\x8B\x50\x78\x43\x89\x94\x08\x9C\x00\x00\x00
Mask=xxxxxxxxxtxxxxxxxx

[SpawnInfoZOffset]
Start=0x400
Pattern=\x48\x8B\x05\xD7\x0A\xC3\x00\x8B\x50\x7C\x43\x89\x94\x08\xA0\x00\x00\x00
Mask=xxxxxxxxxtxxxxxxxx

[SpawnInfoSpeedOffset]
