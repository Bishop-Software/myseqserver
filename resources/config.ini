[SpawnInfoNameOffset]
Start=0x400
Pattern=\x8B\x05\xEB\x2A\xC7\x00\x49\x8D\x88\xB4\x00\x00\x00\x48\x8D\x55\xB0\x48\x2B\xD1\x0F
Mask=xxxxxxxxxttttxxxxxxxx

[SpawnInfoTypeOffset]
