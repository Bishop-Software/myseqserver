name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake + Ninja)
        run: cmake -G Ninja -S . -B cmake-build-debug -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build cmake-build-debug

      - name: Run offline smoke tests
        run: .\cmake-build-debug\OffsetScanningTests.exe
