name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            build_dir: cmake-build-debug
          - build_type: Release
            build_dir: cmake-build-release

    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake + Ninja)
        run: cmake -G Ninja -S . -B ${{ matrix.build_dir }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build ${{ matrix.build_dir }}

      - name: Run offline smoke tests
        run: .\${{ matrix.build_dir }}\OffsetScanningTests.exe
